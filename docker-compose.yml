# docker compose up --build
# Web UI: http://localhost:3000   API: http://localhost:8000/api/health
# Settings come from the one .env next to this file (start from .env.example). For anything beyond local testing
# set VR_SECRET_KEY and DB_PASSWORD there.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicerep
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      POSTGRES_DB: voicerep
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicerep"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    # Everything in .env reaches the app, so a new setting needs no edit here. The lines under `environment:` win over
    # .env: they pin the database to the PostgreSQL container below and give a few settings a deployment default.
    env_file:
      - path: .env
        required: false
    environment:
      VR_ENV: ${VR_ENV:-development}
      VR_DATABASE_URL: postgresql+psycopg://voicerep:${DB_PASSWORD:-change-me-locally}@db:5432/voicerep
      VR_SECRET_KEY: ${VR_SECRET_KEY:-}
      VR_ALLOWED_ORIGINS: ${VR_ALLOWED_ORIGINS:-http://localhost:3000}
      VR_PUBLIC_APP_URL: ${VR_PUBLIC_APP_URL:-http://localhost:3000}
      VR_COOKIE_SECURE: ${VR_COOKIE_SECURE:-false}
      VR_LLM_URL: ${VR_LLM_URL:-}
      VR_ASR_MODEL: ${VR_ASR_MODEL:-base.en}                       # tiny.en | base.en | small.en
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      VR_TTS_ENGINE: ${VR_TTS_ENGINE:-kokoro}                      # kokoro | piper
      VR_AUTO_INSTALL_MODELS: ${VR_AUTO_INSTALL_MODELS:-true}      # download Whisper + Kokoro on first start
      VR_SMTP_HOST: ${VR_SMTP_HOST:-}                              # blank = e-mail reminders off
      VR_SMTP_PORT: ${VR_SMTP_PORT:-587}
      VR_SMTP_USERNAME: ${VR_SMTP_USERNAME:-}
      VR_SMTP_PASSWORD: ${VR_SMTP_PASSWORD:-}
      VR_SMTP_FROM: ${VR_SMTP_FROM:-}
      VR_SMTP_STARTTLS: ${VR_SMTP_STARTTLS:-true}
      VR_VAPID_CONTACT: ${VR_VAPID_CONTACT:-mailto:admin@example.com}
    volumes: [appdata:/app/data]    # models, uploads, recordings
    # 9092 is the AudioSocket listener. It has no login of its own, so only this machine (Asterisk) may reach it.
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:9092:9092"]  # only nginx on this machine reaches the API

  web:
    restart: unless-stopped
    build:
      context: .
      # .env itself stays out of the image (.dockerignore), so the one browser setting is handed over here.
      args: {BACKEND_URL: "http://api:8000", NEXT_PUBLIC_VOICE_WS_ORIGIN: "${NEXT_PUBLIC_VOICE_WS_ORIGIN:-}"}
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]  # only nginx on this machine reaches the site

  # Optional LLM that only classifies unusual phrasing (backend/app/voice/llm.py). OFF by default: it needs about
  # 2 GB of RAM of its own on top of everything else. To use it:
  #   1. Platform admin -> install "Qwen2.5-1.5B-Instruct" (downloads into the shared appdata volume)
  #   2. in .env set VR_LLM_URL=http://llm:8081 and COMPOSE_PROFILES=llm (so every deploy keeps it running)
  #   3. docker compose up -d
  # Until the model file exists the container keeps restarting; that is expected and harmless.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    restart: unless-stopped
    command: ["-m", "/app/data/models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8081",
              "--ctx-size", "8192", "--parallel", "2"]    # 2 request slots x 4096 tokens each
    volumes: ["appdata:/app/data:ro"]
    mem_limit: 2g

  # Asterisk handles SIP. Mount your generated pjsip.conf / extensions.conf (Integrations -> Phone line).
  asterisk:
    image: andrius/asterisk:latest
    profiles: ["phone"]
    network_mode: host      # SIP/RTP need host networking; AudioSocket reaches the API on localhost:9092
    volumes: ["./deploy/asterisk:/etc/asterisk/custom:ro"]

volumes:
  pgdata:
  appdata:
