# docker compose up --build
# Web UI: http://localhost:3000   API: http://localhost:8000/api/health
# Set VR_SECRET_KEY (and DB_PASSWORD) in a .env file next to this file for anything beyond local testing.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicerep
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      POSTGRES_DB: voicerep
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicerep"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      VR_ENV: ${VR_ENV:-development}
      VR_DATABASE_URL: postgresql+psycopg://voicerep:${DB_PASSWORD:-change-me-locally}@db:5432/voicerep
      VR_SECRET_KEY: ${VR_SECRET_KEY:-}
      VR_ALLOWED_ORIGINS: ${VR_ALLOWED_ORIGINS:-http://localhost:3000}
      VR_PUBLIC_APP_URL: ${VR_PUBLIC_APP_URL:-http://localhost:3000}
      VR_COOKIE_SECURE: ${VR_COOKIE_SECURE:-false}
      VR_LLM_URL: ${VR_LLM_URL:-}
      VR_ASR_MODEL: ${VR_ASR_MODEL:-base.en}                       # tiny.en | base.en | small.en
      VR_AUTO_INSTALL_MODELS: ${VR_AUTO_INSTALL_MODELS:-true}      # download Whisper + Kokoro on first start
      VR_ASTERISK_TOKEN: ${VR_ASTERISK_TOKEN:-}                    # same value as the asterisk service
      VR_MAX_CONCURRENT_CALLS: ${VR_MAX_CONCURRENT_CALLS:-4}
    stop_grace_period: 130s         # lets calls finish during a deploy; keep this above the API's 120-second wait
    volumes: [appdata:/app/data]    # models, uploads, recordings
    # 9092 is the AudioSocket listener. It has no login of its own, so only this machine (Asterisk) may reach it.
    ports: ["8000:8000", "127.0.0.1:9092:9092"]

  web:
    restart: unless-stopped
    build:
      context: .
      args: {BACKEND_URL: "http://api:8000"}
    depends_on: [api]
    ports: ["3000:3000"]

  # Optional LLM that only classifies unusual phrasing (backend/app/voice/llm.py). OFF by default: it needs about
  # 2 GB of RAM of its own on top of everything else. To use it:
  #   1. Platform admin -> install "Qwen2.5-1.5B-Instruct" (downloads into the shared appdata volume)
  #   2. in .env set VR_LLM_URL=http://llm:8081 and COMPOSE_PROFILES=llm (so every deploy keeps it running)
  #   3. docker compose up -d
  # Until the model file exists the container keeps restarting; that is expected and harmless.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    restart: unless-stopped
    command: ["-m", "/app/data/models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8081",
              "--ctx-size", "8192", "--parallel", "2"]    # 2 request slots x 4096 tokens each
    volumes: ["appdata:/app/data:ro"]
    mem_limit: 2g

  # Asterisk answers SIP calls and streams their audio to the API. OFF by default; see deploy/asterisk/README.txt.
  asterisk:
    build: ./deploy/asterisk
    profiles: ["phone"]
    restart: unless-stopped
    network_mode: host      # SIP/RTP need host networking; AudioSocket reaches the API on localhost:9092
    environment:
      VR_ASTERISK_TOKEN: ${VR_ASTERISK_TOKEN:-}
      ASTERISK_PUBLIC_IP: ${ASTERISK_PUBLIC_IP:-}
      ASTERISK_LOCAL_NET: ${ASTERISK_LOCAL_NET:-172.31.0.0/16}
      SIP_PROVIDER_HOST: ${SIP_PROVIDER_HOST:-}
      SIP_PROVIDER_IPS: ${SIP_PROVIDER_IPS:-}

volumes:
  pgdata:
  appdata:
