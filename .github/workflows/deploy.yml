name: Deploy to AWS

# Deploys to the EC2 server over SSH whenever main changes (or when started by hand from the Actions tab).
# The server pulls the new code itself and rebuilds with docker compose, exactly like a manual deploy.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   EC2_HOST     public IP or DNS name of the server
#   EC2_USER     SSH user on the server (for example ubuntu or ec2-user)
#   EC2_SSH_KEY  PRIVATE key whose public half is in ~/.ssh/authorized_keys on the server
#   SERVER_ENV   (optional) extra variables for the server's .env, one NAME=value per line, for example the API keys.
#                Every deploy merges them into ~/AIVoiceReceptionist/.env (deploy/merge-env.sh): a name that already
#                exists is replaced, a new one is added, every other line is kept, and VR_SECRET_KEY and DB_PASSWORD are
#                never changed this way. Copy each value exactly as it is written in your local .env.
#                After editing this secret, start the workflow again (Actions -> Deploy to AWS -> Run workflow).
#
# The runner needs to reach port 22 of the server; GitHub's runner IPs change, so the security group
# must allow SSH from the internet for this to work.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy that is half way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: AIVoiceReceptionist # folder in the SSH user's home directory on the server
  HEALTH_URL: https://voice.theorbitechsolution.com/api/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # A key pasted through a web form often picks up Windows line endings, stray spaces or blank lines,
          # which OpenSSH rejects with "error in libcrypto". Normalise it, then check that it really loads.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::EC2_SSH_KEY is empty, damaged or protected by a passphrase. Paste the whole private key again."
            exit 1
          fi
          # Fingerprint of the key (public information). It must match the key added to authorized_keys on the server.
          ssh-keygen -lf ~/.ssh/deploy_key.pub
          # The server's SSH host PUBLIC key (ed25519), pinned so a look-alike server can't receive the key.
          # It is stored under an alias, so it does not matter whether EC2_HOST is an IP or a DNS name.
          # If the server is ever rebuilt its host key changes: update the line below to the new one.
          echo 'deploy-target ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBFqrLH5dnXk4W8DqpgsAmWt9wJS0G6E9ATLv8KmFDqo' > ~/.ssh/known_hosts

      - name: Pull and rebuild on the server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          ssh_opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o HostKeyAlias=deploy-target
                    -o ConnectTimeout=20 -o ServerAliveInterval=30)
          target="$EC2_USER@$EC2_HOST"

          # Optional extra variables for the server's .env (secret SERVER_ENV). They travel inside the SSH
          # connection, never on a command line, and are merged on the server by deploy/merge-env.sh.
          # Nothing in this job ever prints a value (the script reports counts only), and GitHub hides the secret
          # itself in the log. Do not add `echo`, `set -x` or `ssh -v` here: that is how a secret would leak.
          if [ -n "$(printf '%s' "$SERVER_ENV" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$SERVER_ENV" | tr -d '\r' | ssh "${ssh_opts[@]}" "$target" 'umask 077 && cat > "$HOME/.voicerep-env.overrides"'
          else
            ssh "${ssh_opts[@]}" "$target" 'rm -f "$HOME/.voicerep-env.overrides"'
          fi

          ssh "${ssh_opts[@]}" "$target" "APP_DIR=$APP_DIR bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -f "$HOME/.voicerep-env.overrides"' EXIT
          cd "$HOME/$APP_DIR"
          git pull --ff-only origin main
          # Merge the extra variables (if any) into .env. The previous .env is kept as ~/.voicerep-env.bak.
          bash deploy/merge-env.sh "$HOME/.voicerep-env.overrides" .env "$HOME/.voicerep-env.bak"
          rm -f "$HOME/.voicerep-env.overrides"
          docker compose up -d --build
          docker image prune -f
          # Every deploy leaves build-cache layers behind (about 0.5 GB each). Drop the ones not used for 3 days;
          # layers reused by recent builds stay, so builds remain fast. Cleanup must never fail a deploy.
          docker builder prune -f --filter until=72h || true
          docker compose ps
          REMOTE

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"database":true'; then
              echo "API is healthy"
              exit 0
            fi
            echo "not healthy yet (attempt $i of 20)"
            sleep 6
          done
          echo "Health check failed: $HEALTH_URL"
          exit 1
