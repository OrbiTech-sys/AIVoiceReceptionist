; Every incoming call follows the same path. The API decides which business a dialled number belongs to,
; so adding a business never means changing this file.

[general]
static=yes
writeprotect=yes

[voicerep-inbound]
exten => _X.,1,Set(VR_DID=${EXTEN})
 same => n,Goto(voicerep-call,s,1)
exten => _+X.,1,Set(VR_DID=${EXTEN})
 same => n,Goto(voicerep-call,s,1)

[voicerep-call]
exten => s,1,Set(VR_UUID=${SHELL(head -c 36 /proc/sys/kernel/random/uuid)})
 same => n,Set(VR_API=http://127.0.0.1:8000/api/telephony/asterisk)
 same => n,Set(VR_AUTH=token=${ENV(VR_ASTERISK_TOKEN)})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)

 ; Ask the API what to do. If it can't be reached the answer is empty, and the caller gets the "sorry" message.
 same => n,Set(VR_DECISION=${CURL(${VR_API}/precall,${VR_AUTH}&uuid=${VR_UUID}&did=${URIENCODE(${VR_DID})}&caller=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${VR_DECISION}" = "ok"]?receptionist)
 same => n,GotoIf($["${VR_DECISION:0:8}" = "forward:"]?forward)
 same => n,Goto(sorry)

 ; TryExec, because a plain AudioSocket that can't connect would end the call without reaching the next line.
 same => n(receptionist),Answer()
 same => n,TryExec(AudioSocket(${VR_UUID},127.0.0.1:9092))
 same => n,GotoIf($["${TRYSTATUS}" != "SUCCESS"]?sorry)

 ; The receptionist hung up. It may have asked to transfer the caller to a person.
 same => n,Set(VR_NEXT=${CURL(${VR_API}/next-action,${VR_AUTH}&uuid=${VR_UUID})})
 same => n,GotoIf($["${VR_NEXT:0:9}" = "transfer:"]?transfer)
 same => n,Hangup()

 same => n(transfer),Set(CALLERID(num)=${VR_DID})
 same => n,Dial(PJSIP/${VR_NEXT:9}@provider,30)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?finished)
 same => n,Set(VR_IGNORED=${CURL(${VR_API}/transfer-failed,${VR_AUTH}&uuid=${VR_UUID})})
 same => n,Goto(sorry)

 same => n(forward),Set(CALLERID(num)=${VR_DID})
 same => n,Dial(PJSIP/${VR_DECISION:8}@provider,30)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?finished)

 same => n(sorry),Answer()
 same => n,Playback(pls-try-call-later)
 same => n(finished),Hangup()
